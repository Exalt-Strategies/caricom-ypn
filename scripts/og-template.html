<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Inter";
    src: url("/fonts/Inter-Variable.ttf") format("truetype-variations");
    font-weight: 100 900;
    font-display: block;
  }
  :root {
    --ink:#000; --paper:#fff; --signal-red:#ee3835; --cobalt:#007df6;
    --acid-lime:#c3f900; --spring-mint:#6dff80; --lavender:#bea2e7;
    --orchid:#e280fd; --lemon:#f8eb39; --kelly-green:#29b24a; --coral:#ffabab;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:"Inter", sans-serif; background:var(--acid-lime);
    padding:26px; overflow:hidden;
  }
  .poster {
    width:100%; height:100%;
    background:var(--cobalt); color:var(--paper);
    border:8px solid var(--ink); border-radius:40px;
    padding:46px 50px;
    display:flex; gap:44px; align-items:stretch;
  }
  .left { flex:1 1 58%; display:flex; flex-direction:column; }
  .logo { width:100%; max-width:540px; height:auto; }
  .headline {
    font-weight:800; text-transform:uppercase; letter-spacing:-0.03em;
    line-height:0.92; font-size:104px; margin-top:34px;
  }
  .spacer { flex:1; }
  .pill {
    align-self:flex-start;
    background:var(--acid-lime); color:var(--ink);
    border:4px solid var(--ink); border-radius:999px;
    font-weight:800; font-size:22px; letter-spacing:0.14em; text-transform:uppercase;
    padding:14px 26px;
  }
  .right { flex:0 0 340px; display:flex; }
  .photo {
    width:100%; height:100%;
    border:14px solid var(--lemon); border-radius:28px;
    overflow:hidden; position:relative; background:var(--spring-mint);
  }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .tag {
    position:absolute; left:14px; bottom:14px;
    background:var(--signal-red); color:var(--paper);
    border:4px solid var(--ink); border-radius:999px;
    font-weight:800; font-size:19px; letter-spacing:0.12em; text-transform:uppercase;
    padding:9px 18px;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="left">
      <img class="logo" src="/logo-white.png" alt="Caribbean Young Parliamentarians Network" />
      <div class="headline">Young<br/>Voices,<br/>Real Seats</div>
      <div class="spacer"></div>
      <div class="pill">The under-40 caucus of the Caribbean</div>
    </div>
    <div class="right">
      <div class="photo">
        <img src="/img/caribbean.jpg" alt="Caribbean shoreline" />
        <div class="tag">15 member states</div>
      </div>
    </div>
  </div>
</body>
</html>
